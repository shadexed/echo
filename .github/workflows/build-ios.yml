name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package to IPA
        run: |
          cd DerivedData/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r Echo.app Payload/
          zip -r -q Echo.ipa Payload
          mkdir -p $RUNNER_TEMP/output
          mv Echo.ipa $RUNNER_TEMP/output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-IPA
          path: ${{ runner.temp }}/output/Echo.ipa
          retention-days: 14
